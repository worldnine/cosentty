[package]
name = "cosentty"
version = "0.1.1"
edition = "2021"
# 依存(mermaid-text / ascii-dag)が 1.92 を要求する。古い rustc では cargo が
# ビルド前に分かりやすく止まるよう明示しておく
rust-version = "1.92"
description = "Terminal viewer and editor for Cosense (Scrapbox) pages"
license = "MIT"
repository = "https://github.com/worldnine/cosentty"
readme = "../README.md"
# 設計メモ(docs/)は GitHub で読むもの。crate には入れない
exclude = ["docs/"]
keywords = ["cosense", "scrapbox", "tui", "ratatui", "wiki"]
categories = ["command-line-utilities", "text-editors"]
default-run = "cosentty"
autobins = false

[features]
# 開発時の実測用バイナリ(probe / *_smoke / spike)。cargo install では入らない
dev-tools = []

[dependencies]
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
image = "0.25"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 設定ファイルの書き戻し。コメントと並びを保つため、型付き読み(toml)とは別に持つ
toml_edit = "0.22"
md5 = "0.7"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
libc = "0.2"
tempfile = "3"
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tachyonfx = { version = "0.25", features = ["std-duration"] }
# mmd テキスト描画の lib 検証用 spike(mmd-lib-spike)。手書き分支と見比べるため。
mermaid-text = "0.57"
term-maths = "1.0"

[build-dependencies]
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[lib]
name = "cosense"
path = "src/lib.rs"

[[bin]]
name = "spike"
path = "src/spike.rs"
required-features = ["dev-tools"]

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "cosentty"
path = "src/bin/view/main.rs"

[[bin]]
name = "edit_smoke"
path = "src/bin/edit_smoke.rs"
required-features = ["dev-tools"]

[[bin]]
name = "web_smoke"
path = "src/bin/web_smoke.rs"
required-features = ["dev-tools"]

[[bin]]
name = "ws_smoke"
path = "src/bin/ws_smoke.rs"
required-features = ["dev-tools"]

[[bin]]
name = "upload_smoke"
path = "src/bin/upload_smoke.rs"
required-features = ["dev-tools"]

[[bin]]
name = "outline_probe"
path = "src/bin/outline_probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "create_smoke"
path = "src/bin/create_smoke.rs"
required-features = ["dev-tools"]
